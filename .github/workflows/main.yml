# File: .github/workflows/main.yml
name: CI Checks

# Trigger CI on push or pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Node.js for frontend
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Step 3: Install frontend dependencies
    - name: Install frontend dependencies
      run: |
        cd Frontend
        npm install

    # Step 4: Run frontend tests
    - name: Run frontend tests
      run: |
        cd Frontend
        if node -e "const fs=require('fs'); try { const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); process.exit((pkg.scripts || {}).test ? 0 : 1); } catch (error) { console.error('Unable to read Frontend/package.json:', error.message); process.exit(2); }"; then
          npm test
        else
          status=$?
          if [ "$status" -eq 1 ]; then
            echo "No frontend test script found. Skipping..."
          else
            exit "$status"
          fi
        fi

    # Step 5: Build frontend
    - name: Build frontend
      run: |
        cd Frontend
        npm run build

    # Step 6: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Step 7: Install backend dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 8: Run backend tests
    - name: Run backend tests
      run: |
        if [ -f "tests/test_sample.py" ]; then
          pytest
        else
          echo "No tests found. Skipping..."
        fi
